# R8 rules for the Release build (see the DropSdkDontObfuscate target in MoneyRecord.csproj).
# The first block is the .NET for Android SDK's own proguard_xamarin.cfg without its -dontobfuscate line.
# Re-compare it with obj/Release/net10.0-android/proguard/proguard_xamarin.cfg after an SDK update.

-keep class android.support.multidex.MultiDexApplication { <init>(); }
-keep class net.dot.jni.** { *; <init>(); }
-keep class mono.MonoRuntimeProvider* { *; <init>(...); }
-keep class mono.MonoPackageManager { *; <init>(...); }
-keep class mono.MonoPackageManager_Resources { *; <init>(...); }
-keep class mono.android.** { *; <init>(...); }
-keep class mono.java.** { *; <init>(...); }
-keep class mono.javax.** { *; <init>(...); }
-keep class net.dot.jni.ManagedPeer { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager_FakeSSLSession { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_AlwaysAcceptingHostnameVerifier { *; <init>(...); }

-keep class android.runtime.** { <init>(...); }
-keep class assembly_mono_android.android.runtime.** { <init>(...); }
# hash for android.runtime and assembly_mono_android.android.runtime.
-keep class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keepclassmembers class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }

# .NET runtime
-keep class net.dot.android.** { *; <init>(...); }

# Android's template misses fluent setters...
-keepclassmembers class * extends android.view.View {
   *** set*(...);
}

# also misses those inflated custom layout stuff from xml...
-keepclassmembers class * extends android.view.View {
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}

-ignorewarnings
-keepattributes SourceFile,LineNumberTable

# The managed bindings look these libraries' classes, fields and methods up by name over JNI, and R8 can't see that.
# (The SDK's generated proguard_project_references.cfg keeps the types, not every member the bindings touch.)
-keepclassmembers class androidx.** { *; }
-keepclassmembers class com.google.** { *; }
-keepclassmembers class kotlin.** { *; }
-keepclassmembers class kotlinx.** { *; }

# Classes Android or the libraries create by name from XML resources and the manifest (the SDK passes no aapt rules)
-keep class * extends android.view.View { <init>(...); }
-keep class * extends android.app.Fragment { <init>(...); }
-keep class * extends androidx.fragment.app.Fragment { <init>(...); }
-keep class * extends android.view.animation.Animation { <init>(...); }
-keep class * extends android.animation.Animator { <init>(...); }
-keep class * extends android.preference.Preference { <init>(...); }
-keep class * extends androidx.preference.Preference { <init>(...); }
-keep class * extends androidx.recyclerview.widget.RecyclerView$LayoutManager { <init>(...); }
-keep class * extends androidx.coordinatorlayout.widget.CoordinatorLayout$Behavior { <init>(...); }
-keep class * extends androidx.work.ListenableWorker { <init>(...); }
-keep class * extends androidx.work.InputMerger { <init>(...); }
-keep class * extends android.app.Activity { <init>(...); }
-keep class * extends android.app.Service { <init>(...); }
-keep class * extends android.content.BroadcastReceiver { <init>(...); }
-keep class * extends android.content.ContentProvider { <init>(...); }
-keep class * extends android.appwidget.AppWidgetProvider { <init>(...); }
