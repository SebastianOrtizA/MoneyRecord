name: Privacy Policy Page

# Publishes PRIVACY.md on GitHub Pages (the Play Console privacy policy URL):
# https://sebastianortiza.github.io/MoneyRecord/privacy
on:
  push:
    branches: [main]
    paths: [PRIVACY.md, .github/workflows/privacy-page.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the policy alone
        run: |
          mkdir site
          printf -- '---\ntitle: MoneyRecord privacy policy\npermalink: /privacy\n---\n\n' > site/privacy.md
          cat PRIVACY.md >> site/privacy.md
          printf -- '---\npermalink: /\nredirect_to: privacy\n---\n' > site/index.md
          printf 'title: MoneyRecord\nplugins: [jekyll-redirect-from]\n' > site/_config.yml

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
