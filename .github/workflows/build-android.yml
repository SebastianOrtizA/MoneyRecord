name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Tests
        run: dotnet build MoneyRecord.Tests/MoneyRecord.Tests.csproj -c Release

      - name: Run Tests
        run: >
          dotnet test MoneyRecord.Tests/MoneyRecord.Tests.csproj --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory TestResults

      # Coverage of MoneyRecord.Core (the tests reference Core only): the total goes to the run summary, the Cobertura
      # report to an artifact. No threshold yet.
      - name: Coverage summary
        if: always()
        run: |
          report=$(find TestResults -name coverage.cobertura.xml | head -n 1)
          if [ -z "$report" ]; then echo "No coverage report." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          rate() { grep -o -m 1 "$1=\"[0-9.]*\"" "$report" | head -n 1 | tr -dc '0-9.'; }
          awk -v l="$(rate line-rate)" -v b="$(rate branch-rate)" \
            'BEGIN { printf "### Coverage (MoneyRecord.Core)\nLines: %.1f%% · Branches: %.1f%%\n", l * 100, b * 100 }' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  build-android:
    name: Build Android APK + AAB
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # versionCode = run number (always increasing, as Android and the Play Store require). versionName comes from a
      # v* tag (v1.2.0 → 1.2.0, v0.9.0-rc1 → 0.9.0-rc1); other builds keep the csproj's ApplicationDisplayVersion.
      # run_number counts per workflow file: renaming or recreating this workflow restarts it at 1, so then add the
      # last published versionCode as an offset. Runs first so a mistyped tag fails in seconds.
      - name: Set version
        id: version
        shell: pwsh
        run: |
          $props = "-p:ApplicationVersion=${{ github.run_number }}"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $name = $env:GITHUB_REF_NAME.Substring(1)
            if ($name -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
              Write-Host "::error::Tag $env:GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-suffix]"
              exit 1
            }
            $props += " -p:ApplicationDisplayVersion=$name"
          }
          Write-Host "Version properties: $props"
          "props=$props" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      # The csproj signs Release builds when MoneyRecord/moneyrecord.keystore exists. Tag builds are published,
      # so they fail before the build when a signing secret is missing instead of shipping a debug-signed APK.
      - name: Decode signing keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $missing = @()
            if (-not $env:ANDROID_KEYSTORE_B64) { $missing += 'ANDROID_KEYSTORE_B64' }
            if ($env:HAS_KEYSTORE_PASSWORD -ne 'true') { $missing += 'KEYSTORE_PASSWORD' }
            if ($env:HAS_KEY_PASSWORD -ne 'true') { $missing += 'KEY_PASSWORD' }
            if ($missing) {
              Write-Host "::error::Tag builds must be signed with the release keystore; missing secrets: $($missing -join ', ')"
              exit 1
            }
          }
          if ($env:ANDROID_KEYSTORE_B64) {
            try { $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64) }
            catch {
              Write-Host "::error::ANDROID_KEYSTORE_B64 is not valid base64: set it from [Convert]::ToBase64String (README, Releases)."
              exit 1
            }
            [IO.File]::WriteAllBytes("MoneyRecord/moneyrecord.keystore", $bytes)
            Write-Host "Signing with the release keystore."
          } else {
            Write-Host "::notice::No release keystore: this build is signed with the debug key."
          }

      # Release builds produce both formats: the .apk for GitHub Releases / F-Droid, the .aab for the Play Store.
      - name: Build Android APK + AAB (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Opt-in crash reports: the csproj stores it in the app (local and fork builds have none and never report)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          dotnet publish MoneyRecord/MoneyRecord.csproj
          -f net10.0-android
          -c Release
          -o publish
          ${{ steps.version.outputs.props }}

      # R8 writes the deobfuscation file next to the packages: without it the Play upload would only fail at the very end
      - name: Check mapping.txt
        shell: pwsh
        run: if (-not (Test-Path publish/mapping.txt)) { throw "publish/mapping.txt is missing: R8 did not write it" }

      - name: Remove signing keystore
        if: always()
        shell: pwsh
        run: Remove-Item MoneyRecord/moneyrecord.keystore -ErrorAction Ignore

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyRecord-Android
          path: |
            publish/*-Signed.apk
            publish/*-Signed.aab
            publish/mapping.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: MoneyRecord-Android
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # A v* tag also sends the .aab to Google Play's closed testing track (alpha; set the
  # repository variable PLAY_TRACK for a custom-named closed track); promoting it to production stays a manual
  # step in Play Console. Needs the PLAY_SERVICE_ACCOUNT_JSON secret (a service account
  # invited in Play Console with release-to-testing permissions; README, Releases). Release notes come from
  # fastlane/metadata/android/<locale>/changelogs/default.txt (500 characters at most).
  play:
    name: Upload to Google Play (closed testing)
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check Play credentials
        id: credentials
        env:
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$HAS_PLAY_KEY" != "true" ]; then
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: the bundle is not uploaded to Google Play."
          fi
          echo "ready=$HAS_PLAY_KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'

      - name: Download Android artifacts
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MoneyRecord-Android
          path: release

      # The upload action reads release notes as whatsnew/whatsnew-<locale>
      - name: Collect release notes
        if: steps.credentials.outputs.ready == 'true'
        run: |
          mkdir whatsnew
          for notes in fastlane/metadata/android/*/changelogs/default.txt; do
            locale=$(basename "$(dirname "$(dirname "$notes")")")
            cp "$notes" "whatsnew/whatsnew-$locale"
          done
          ls whatsnew

      # Play only takes "draft" releases until the app has been published once: set the repository variable
      # PLAY_RELEASE_STATUS to draft then (and roll the release out in Play Console), otherwise leave it unset.
      - name: Upload bundle
        if: steps.credentials.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sebastianortiz.moneyrecord
          releaseFiles: release/*.aab
          # R8's deobfuscation file, so Play can read crash stack traces and stops warning about it
          mappingFile: release/mapping.txt
          releaseName: ${{ github.ref_name }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
