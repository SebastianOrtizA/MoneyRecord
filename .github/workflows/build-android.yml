name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore MoneyRecord.Tests/MoneyRecord.Tests.csproj

      - name: Build Tests
        run: dotnet build MoneyRecord.Tests/MoneyRecord.Tests.csproj --no-restore -c Release

      - name: Run Tests
        run: dotnet test MoneyRecord.Tests/MoneyRecord.Tests.csproj --no-build -c Release --verbosity normal

  build-android:
    name: Build Android APK
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore MoneyRecord/MoneyRecord.csproj

      - name: Build Android APK (Release)
        run: >
          dotnet publish MoneyRecord/MoneyRecord.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyRecord-Android-APK
          path: MoneyRecord/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MoneyRecord-Android-APK
          path: release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          generate_release_notes: true
