name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Tests
        run: dotnet build MoneyRecord.Tests/MoneyRecord.Tests.csproj -c Release

      - name: Run Tests
        run: dotnet test MoneyRecord.Tests/MoneyRecord.Tests.csproj --no-build -c Release --verbosity normal

  build-android:
    name: Build Android APK + AAB
    runs-on: windows-latest
    needs: test
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      # The csproj signs Release builds when MoneyRecord/moneyrecord.keystore exists. Tag builds are published,
      # so they fail without the keystore instead of shipping an APK signed with the debug key.
      - name: Decode signing keystore
        shell: pwsh
        run: |
          if ($env:ANDROID_KEYSTORE_B64) {
            [IO.File]::WriteAllBytes("MoneyRecord/moneyrecord.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))
            Write-Host "Signing with the release keystore."
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            Write-Error "ANDROID_KEYSTORE_B64 is not set: tag builds must be signed with the release keystore."
            exit 1
          } else {
            Write-Host "::notice::No release keystore: this build is signed with the debug key."
          }

      # Release builds produce both formats: the .apk for GitHub Releases / F-Droid, the .aab for the Play Store.
      - name: Build Android APK + AAB (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          dotnet publish MoneyRecord/MoneyRecord.csproj
          -f net10.0-android
          -c Release
          -o publish

      - name: Remove signing keystore
        if: always()
        shell: pwsh
        run: Remove-Item MoneyRecord/moneyrecord.keystore -ErrorAction Ignore

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyRecord-Android
          path: |
            publish/*-Signed.apk
            publish/*-Signed.aab
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: MoneyRecord-Android
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
          generate_release_notes: true
