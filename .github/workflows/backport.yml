name: Backport

# A merged PR labelled "backport release/<major>.<minor>" is cherry-picked onto a new branch backport/<PR>-to-release-<x.y>,
# and a pull request from it to that release branch is opened. The release branches only take changes through a pull
# request (a push from here is refused, GH013), so merging that PR is the step that builds the branch (and publishes the
# next patch when its release notes are in): the owner decides when. A conflict is reported on the PR to resolve by hand.
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests". A pull request opened
# with GITHUB_TOKEN starts no workflow, so the opened PR has no Build & Test run until it is merged (the push to the
# release branch then builds it).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(join(github.event.pull_request.labels.*.name, ','), 'backport release/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open a backport pull request per release branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '|') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=0
          labels=$(printf '%s' "$LABELS" | tr '|' '\n')
          # One label per line, read on fd 3 so the commands inside the loop never touch it (and IFS stays untouched)
          while IFS= read -r label <&3; do
            case "$label" in "backport release/"*) ;; *) continue ;; esac
            branch=${label#backport }
            work="backport/$PR-to-${branch//\//-}"
            # A merge commit needs -m 1; squash and rebase merges are plain commits
            parents=$(git rev-list --parents -n 1 "$SHA" | wc -w)
            if [ "$parents" -gt 2 ]; then pick="git cherry-pick -m 1 $SHA"; else pick="git cherry-pick $SHA"; fi
            by_hand="git fetch origin && git checkout -b $work origin/$branch && $pick && git push -u origin $work"
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              gh pr comment "$PR" --body "Backport: branch \`$branch\` does not exist."; failed=1; continue
            fi
            if git ls-remote --exit-code --heads origin "$work" > /dev/null; then
              gh pr comment "$PR" --body "Backport to \`$branch\` skipped: the branch \`$work\` already exists (an earlier run?). Look for its pull request, or delete the branch and re-run."
              failed=1; continue
            fi
            git checkout -q -B "$work" "origin/$branch"
            if $pick && git push -q origin "HEAD:refs/heads/$work"; then
              body="Backport of #$PR (commit \`$SHA\`) onto \`$branch\`, opened by the Backport workflow.

          \`$branch\` only takes changes through a pull request, so this is the step that builds it: if the top \`##\` section of the en-US \`history.txt\` there names a version without a tag, merging this publishes it (tag, GitHub Release, Play closed testing)."
              if url=$(gh pr create --base "$branch" --head "$work" --title "Backport #$PR to $branch: $TITLE" --body "$body"); then
                gh pr comment "$PR" --body "Backport to \`$branch\`: $url. Merging it builds the branch and publishes the next patch once its release notes are on it."
              else
                gh pr comment "$PR" --body "Backport to \`$branch\`: the branch \`$work\` is pushed but its pull request could not be opened (is \"Allow GitHub Actions to create and approve pull requests\" on?). Open one from \`$work\` to \`$branch\`."
                failed=1
              fi
            else
              git cherry-pick --abort 2>/dev/null || true
              gh pr comment "$PR" --body "Backport to \`$branch\` failed (a conflict?). By hand: \`$by_hand\`, then open a pull request from \`$work\` to \`$branch\`."
              failed=1
            fi
          done 3<<< "$labels"
          exit $failed
